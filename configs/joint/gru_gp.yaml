dataset: full_merged
run_sig: in52_out16_ep50_seed40_full_merged_random_max_dist_90_lsp0p1
data:
  in_len: 52
  out_len: 16
  statics: true
model:
  gru_hidden: 128
  gru_layers: 2
  gru_dropout: 0.2
  dropout: 0.2
training:
  epochs: 50
  batch_size: 4096
  seed: 40
  num_workers: 10
  lr: 0.0003
  grad_clip: 1.0
  early_stopping:
    monitor: val_loss
    patience: 5
    min_delta: 0.0001
    mode: min
spatial_split:
  file: splits/random_max_dist_90.csv
  train_fraction: 0.9
  cluster_count: 20
  split_seed: 42
  exclude_terms: geometry,x_25833,y_25833
spatial_gp:
  backend: gpytorch
  n_inducing: 64
  jitter: 0.0001
  use_float64: true
  init_noise: 0.1
  lambda_spatial: 0.5
  max_train_points_per_horizon: 2000
  variational_lr: 0.01
  gp_pretrain_steps: 200
joint:
  gru_lr: 0.0003
  gp_lr: 0.001
  gp_weight: 0.5
  n_gp_dates: 8
  gp_subset_size: 100
  gru_pretrained_run_sig: in52_out16_ep50_bs4096_seed40_full_merged_r1_spf0p8_sc20_ss42
  gp_pretrained_run_sig: ''
  spatial_val_fraction: 0.5
  min_train_wells: 5
  min_val_wells: 2
  val_gp_stride: 4
