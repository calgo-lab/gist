dataset: full_merged
run_sig: in52_out16_ep50_seed40_full_merged_random_max_dist_90_lsp0p1
data:
  in_len: 52
  out_len: 16
  statics: true
model:
  gru_hidden: 256
  gru_layers: 4
  gru_dropout: 0.2
training:
  epochs: 50
  seed: 40
  grad_clip: 1.0
  early_stopping:
    patience: 5
    min_delta: 0.0001
spatial_split:
  file: splits/random_max_dist_90.csv
  train_fraction: 0.9
  cluster_count: 20
  split_seed: 42
  exclude_terms: geometry,x_25833,y_25833
spatial_gp:
  jitter: 0.0001
  use_float64: true
  init_noise: 0.1
  lambda_spatial: 0.5
  max_train_points_per_horizon: 2000
  variational_lr: 0.01
  gp_pretrain_steps: 200
joint:
  gru_lr: 0.0002
  gp_lr: 0.0002
  n_gp_dates: 8
  gru_pretrained_run_sig: ''
  min_train_wells: 5
  min_val_wells: 2
  val_gp_stride: 4
