  note: oracle-clean-rand

twostage_prod:
  seeds: "42-81"
  base: configs/gru/gru.yaml
  scripts:
    - src/scripts/pipelines/temporal/gru_train.py
    - src/scripts/pipelines/temporal/gru_eval.py
    - src/scripts/pipelines/spatial/gp_eval.py
  overrides:
    run_sig: in52_out16_ep50_bs4096_seed47_coloc_rand90_f90_ss{ss}
    dataset: full_merged
    training.seed: 47
    add_hydroraum_onehot: true
    spatial_split.file: splits/spatial_split_full_merged_coloc_rand90_f90_ss{ss}.csv
    spatial_split.train_fraction: 0.90
    gp_features: []
    gp_features_onehot: [hydroraum]
    gru_run_sig: in52_out16_ep50_bs4096_seed47_coloc_rand90_f90_ss{ss}
    gp_run_tag: dec_prod_hr_gps7
    gp_seed: 7
    date_freq: D
    pretrain_steps: 300
    max_pretrain_pts: 128
    variational_lr: 0.0001
    jitter: 0.00001
    use_float64: true
    model_prefix: GRU_FCOV
  prebuild:
    - builder: src/prep/build_coloc_split.py
      args:
        output: "splits/spatial_split_full_merged_coloc_rand90_f90_ss{ss}.csv"
        density-percentile: none
        mode: two-way
        n-holdout: 104
        seed: "{ss}"
  note: submit_multiseed40_decoupled (gru seed 47, gp seed 7, coloc rand90 f90, hydroraum-only, holdout 104)

joint_exact_rand:
  base: configs/joint/gru_gp.yaml
  script: src/scripts/pipelines/joint/gru_gp_train.py
  overrides:
    run_sig: in52_out16_ep50_seed40_exact3w_rand_ss42
    spatial_split.file: splits/spatial_split_joint_rand_f95_ss42_3way.csv
    model.gru_hidden: 128
    model.gru_layers: 5
    model.gru_dropout: 0.3
    spatial_gp.lambda_spatial: 0.034
    spatial_gp.gp_pretrain_steps: 300
    spatial_gp.variational_lr: 0.01
    spatial_gp.max_train_points_per_horizon: 2000
    spatial_gp.use_float64: true
    spatial_gp.gp_features: [siwa_verweilzeit_j]
    spatial_gp.gp_features_onehot: [hydroraum, gw_gespannt]
    joint.gru_lr: 1.07e-4
    joint.gp_lr: 1.0e-3
    joint.min_train_wells: 5
    joint.min_val_wells: 2
    joint.val_gp_stride: 4
  prebuild:
    - builder: src/prep/build_coloc_split.py
      args: {output: splits/spatial_split_joint_rand_f95_ss42_3way.csv, density-percentile: none, mode: three-way, n-holdout: 52}
