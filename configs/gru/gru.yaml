dataset: full_merged
run_sig: auto
data:
  in_len: 52
  out_len: 16
model:
  gru_hidden: 256
  gru_layers: 4
  gru_dropout: 0.2
training:
  epochs: 50
  batch_size: 4096
  seed: 40
  lr: 0.0002
  grad_clip: 1.0
  early_stopping:
    patience: 5
    min_delta: 0.0001
spatial_split:
  file: splits/spatial_split_full_merged_random_f0p9_ss42.csv
  split_type: random
  train_fraction: 0.9
  split_seed: 42
  cluster_count: 10
  max_dist_k: 3
  max_dist_percentile: 25
