dataset: full_merged
model: GRU_FCOV
gru_run_sig: "gru_l2_seed40_ep50_full_merged_spf0p8_sc20_ss42"
gp_run_tag: "gp_gok_only"
run_sig: auto
seed: 40
spatial_split:
  file: splits/spatial_split_full_merged_spf0p8_sc20_ss42.csv
max_pairs: 0

date_freq: "ME"
pretrain_steps: 300
pretrain_lr: 0.01
max_pretrain_pts: 2000

backend: "gpytorch"
kernel_type: "matern32"
isotropic: true
jitter: 0.00001
n_inducing: 64
variational_lr: 0.01
use_float64: true

gp_features:
  - gok
gp_features_onehot: []

kernel:
  nu: 1.5
  length_scale: 1.0
  noise: 0.001
  restarts: 2
