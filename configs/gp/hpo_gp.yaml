name: gp_gpytorch_hpo_v3
max_trials: 12
random_seed: 42
objective:
  metric: nRMSE
  mode: min
search_space:
  backend: [gpytorch]
  n_inducing: [64]
  jitter: [0.0001]
  use_float64: [true]
  pretrain_steps: [100, 200, 500]
  variational_lr: [0.001, 0.01, 0.1]
  max_pretrain_pts: [128, 512]
  kernel_type: [matern32]
  isotropic: [true]
