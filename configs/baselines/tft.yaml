dataset: full_merged

model:
  dropout: 0.2

run_sig: auto

data:
  in_len: 52
  out_len: 16
  statics: true

training:
  epochs: 50
  batch_size: 4096
  seed: 40
  num_workers: 10
  lr: 3e-4
  grad_clip: 1.0
  early_stopping:
    monitor: val_loss
    patience: 5
    min_delta: 1e-4
    mode: min

spatial_split:
  file: "splits/spatial_split_full_merged_spf0p8_sc20_ss42.csv"
  train_fraction: 0.8
  cluster_count: 20
  split_seed: 42
  exclude_terms: geometry,x_25833,y_25833

eval:
  stride: 1
  retrain: false
  force_reeval: false

runs:
  in_lens:
  - 52
  out_lens:
  - 16
  statics:
  - true
  epochs:
  - 1
  batch_size: 4096
  seeds:
  - 40

wandb:
  project: gw-pred
  entity: gw-pred
  enabled: true
