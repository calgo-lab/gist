apiVersion: batch/v1
kind: Job
metadata:
  name: gw-analysis
  labels:
    app: gw-analysis
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: gw-analysis
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: gpu
                operator: NotIn
                values:
                - k80
                - p100
                - b200
                - "false"
      volumes:
      - name: gw-pred-rwx
        persistentVolumeClaim:
          claimName: gw-pred-rwx
      containers:
      - name: gw-analysis
        image: row56/gw-pred:py312-cu124
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "8"
            memory: 40Gi
          limits:
            memory: 40Gi
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: gw-pred-rwx
          mountPath: /storage
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          source /storage/venv/bin/activate
          cd /storage/gwl-interpolation
          python src/analysis/<script>.py
