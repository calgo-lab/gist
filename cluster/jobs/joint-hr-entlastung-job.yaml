apiVersion: batch/v1
kind: Job
metadata:
  name: gw-joint-hr-entlastung-a100
  labels:
    app: gw-gru-gp-joint
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: gw-gru-gp-joint
    spec:
      restartPolicy: Never
      nodeSelector:
        gpu: a100
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - cl-worker24
      volumes:
      - name: gw-pred-rwx
        persistentVolumeClaim:
          claimName: gw-pred-rwx
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      containers:
      - name: gru-gp-hr-entlastung
        image: row56/gw-pred:py312-cu124
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: 1
          limits:
            memory: 64Gi
            nvidia.com/gpu: 1
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: gw-pred-rwx
          mountPath: /storage
        - name: dshm
          mountPath: /dev/shm
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          source /storage/venv/bin/activate
          cd /storage/gwl-interpolation

          CFG=/tmp/joint_hr_entlastung.yaml
          python3 -c "
          import yaml
          cfg = yaml.safe_load(open('configs/joint/gru_gp.yaml'))
          cfg['hydroraum_filter'] = 'Entlastungsgebiete'
          cfg['run_sig'] = 'in52_out16_ep50_seed40_full_merged_lsp0p001_hr_entlastung'
          cfg['spatial_gp']['lambda_spatial'] = 0.001
          yaml.dump(cfg, open('$CFG', 'w'), default_flow_style=False)
          "

          mkdir -p reports/gru_gp/logs
          {
            echo '=== JOINT TRAIN hr=Entlastungsgebiete ==='
            time python src/scripts/joint/gru_gp_train.py --config $CFG
            echo '=== JOINT EVAL ==='
            time python src/scripts/joint/gru_gp_eval.py --config $CFG
          } 2>&1 | tee "reports/gru_gp/logs/joint_hr_entlastung.log"
