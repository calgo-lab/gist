apiVersion: batch/v1
kind: Job
metadata:
  name: gw-dedup-pilot
  labels:
    app: gw-dedup-pilot
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: gw-dedup-pilot
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - cl-worker24
              - key: gpu
                operator: NotIn
                values:
                - k80
                - p100
                - "false"
      volumes:
      - name: gw-pred-rwx
        persistentVolumeClaim:
          claimName: gw-pred-rwx
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      containers:
      - name: gru-decoupled
        image: row56/gw-pred:py312-cu124
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: 1
          limits:
            memory: 64Gi
            nvidia.com/gpu: 1
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: gw-pred-rwx
          mountPath: /storage
        - name: dshm
          mountPath: /dev/shm
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          source /storage/venv/bin/activate
          cd /storage/gwl-interpolation
          git pull

          echo '=== Deduplication ==='
          python cluster/scripts/preprocess_dedup.py
          echo '=== Generating splits ==='
          python cluster/scripts/generate_splits.py

          # GRU config: best HPO params + dedup random f=0.95 ss=42 split
          GRU_CFG=/tmp/gru_dedup_pilot.yaml
          python3 -c "
          import yaml
          cfg = yaml.safe_load(open('configs/gru/gru.yaml'))
          cfg['run_sig'] = 'in52_out16_ep50_bs4096_seed40_dedup_rnd_f0p95_ss42'
          cfg['spatial_split'] = {
              'file': 'splits/spatial_split_full_merged_dedup_random_f0p95_ss42.csv',
              'train_fraction': 0.95,
          }
          yaml.dump(cfg, open('$GRU_CFG', 'w'), default_flow_style=False)
          "

          # GP config: best feature set (siwa + hydroraum + gw_gespannt)
          GP_CFG=/tmp/gp_dedup_pilot.yaml
          python3 -c "
          import yaml
          cfg = yaml.safe_load(open('configs/gp/gp.yaml'))
          cfg['gp_features'] = ['siwa_verweilzeit_j']
          cfg['gp_features_onehot'] = ['hydroraum', 'gw_gespannt']
          cfg['spatial_split'] = {
              'file': 'splits/spatial_split_full_merged_dedup_random_f0p95_ss42.csv',
              'train_fraction': 0.95,
          }
          yaml.dump(cfg, open('$GP_CFG', 'w'), default_flow_style=False)
          "

          mkdir -p reports/gru_gp/logs
          {
            echo '=== TRAIN decoupled GRU (dedup pilot) ==='
            time python src/scripts/joint/temporal/gru_train.py --config $GRU_CFG

            echo '=== EVAL decoupled GRU (dedup pilot) ==='
            time python src/scripts/joint/temporal/gru_eval.py --config $GRU_CFG

            echo '=== GP on decoupled GRU predictions (dedup pilot) ==='
            time python src/scripts/joint/spatial/gp_eval.py \
              --config $GP_CFG \
              --gru-run-sig in52_out16_ep50_bs4096_seed40_dedup_rnd_f0p95_ss42 \
              --gp-run-tag dedup_pilot_rnd_f0p95_ss42 \
              --pretrain-steps 300 \
              --pretrain-lr 0.01 \
              --max-pretrain-pts 2000 \
              --date-freq ME \
              --jitter 0.00001 \
              --use-float64 true \
              --model-prefix GRU_FCOV
          } 2>&1 | tee "reports/gru_gp/logs/dedup_pilot.log"
