apiVersion: batch/v1
kind: Job
metadata:
  name: gw-gp-tft-ep50-a100
  labels:
    app: gw-gp-spatial
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: gw-gp-spatial
    spec:
      restartPolicy: Never
      nodeSelector:
        gpu: a100
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - cl-worker24
      volumes:
      - name: gw-pred-rwx
        persistentVolumeClaim:
          claimName: gw-pred-rwx
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "8Gi"
      containers:
      - name: gp-spatial
        image: row56/gw-pred:py312-cu124
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: 1
          limits:
            memory: 32Gi
            nvidia.com/gpu: 1
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: MODEL_PREFIX
          value: "TFT"
        - name: TEMPORAL_RUN_SIG
          value: "in52_out16_ep50_bs4096_stat1_seed40_full_merged"
        - name: GP_RUN_TAG
          value: "gp_pytorch_matern32"
        - name: PRETRAIN_STEPS
          value: "300"
        volumeMounts:
        - name: gw-pred-rwx
          mountPath: /storage
        - name: dshm
          mountPath: /dev/shm
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          source /storage/venv/bin/activate
          cd /storage/gwl-interpolation

          PRED_PATH="outputs/${MODEL_PREFIX}/${MODEL_PREFIX}_${TEMPORAL_RUN_SIG}/predictions/pred.parquet"
          if [ ! -f "${PRED_PATH}" ]; then
            PRED_PATH="$(find "outputs/${MODEL_PREFIX}" -type f -path "*/predictions/pred.parquet" | sort | tail -n 1 || true)"
            if [ -z "${PRED_PATH}" ]; then
              echo "No ${MODEL_PREFIX} prediction parquet found under outputs/${MODEL_PREFIX}/"
              exit 1
            fi
            TEMPORAL_RUN_SIG="$(basename "$(dirname "$(dirname "${PRED_PATH}")")")"
            TEMPORAL_RUN_SIG="${TEMPORAL_RUN_SIG#${MODEL_PREFIX}_}"
          fi

          mkdir -p /storage/gwl-interpolation/reports/gp/logs
          {
            echo "=== GP EVAL on ${MODEL_PREFIX} ${TEMPORAL_RUN_SIG} ==="
            time python src/scripts/joint/spatial/gp_eval.py \
              --model-prefix "${MODEL_PREFIX}" \
              --gru-run-sig "${TEMPORAL_RUN_SIG}" \
              --pred-path "${PRED_PATH}" \
              --gp-run-tag "${GP_RUN_TAG}" \
              --pretrain-steps "${PRETRAIN_STEPS}" \
              --date-freq ME
          } 2>&1 | tee "/storage/gwl-interpolation/reports/gp/logs/${MODEL_PREFIX}_${TEMPORAL_RUN_SIG}__${GP_RUN_TAG}.log"
