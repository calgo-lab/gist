apiVersion: batch/v1
kind: Job
metadata:
  name: gw-decoupled-rmd90-a100
  labels:
    app: gw-gru-time
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: gw-gru-time
    spec:
      restartPolicy: Never
      nodeSelector:
        gpu: a100
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - cl-worker24
      volumes:
      - name: gw-pred-rwx
        persistentVolumeClaim:
          claimName: gw-pred-rwx
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      containers:
      - name: gru-decoupled
        image: row56/gw-pred:py312-cu124
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: 1
          limits:
            memory: 64Gi
            nvidia.com/gpu: 1
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: gw-pred-rwx
          mountPath: /storage
        - name: dshm
          mountPath: /dev/shm
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          source /storage/venv/bin/activate
          cd /storage/gwl-interpolation

          CFG=/tmp/gru_decoupled_rmd90.yaml
          python3 -c "
          import yaml
          cfg = yaml.safe_load(open('configs/gru/gru.yaml'))
          cfg['run_sig'] = 'in52_out16_ep50_bs4096_seed40_full_merged_rmd90_decoupled'
          cfg['spatial_split'] = {
              'file': 'splits/random_max_dist_90.csv',
              'train_fraction': 0.9,
              'cluster_count': 20,
              'split_seed': 42,
              'exclude_terms': 'geometry,x_25833,y_25833',
          }
          yaml.dump(cfg, open('$CFG', 'w'), default_flow_style=False)
          "

          mkdir -p reports/gru_gp/logs
          {
            echo '=== TRAIN decoupled GRU (rmd90) ==='
            time python src/scripts/joint/temporal/gru_train.py --config $CFG
            echo '=== EVAL decoupled GRU (rmd90) ==='
            time python src/scripts/joint/temporal/gru_eval.py --config $CFG
            echo '=== GP on decoupled GRU predictions ==='
            time python src/scripts/joint/spatial/gp_eval.py \
              --config $CFG \
              --gru-run-sig in52_out16_ep50_bs4096_seed40_full_merged_rmd90_decoupled \
              --gp-run-tag decoupled_rmd90 \
              --backend gpytorch \
              --n-inducing 64 \
              --pretrain-steps 200 \
              --pretrain-lr 0.01 \
              --max-pretrain-pts 2000 \
              --date-freq ME \
              --jitter 0.0001 \
              --use-float64 true \
              --model-prefix GRU_FCOV
          } 2>&1 | tee "reports/gru_gp/logs/decoupled_rmd90.log"
