apiVersion: batch/v1
kind: Job
metadata:
  name: gw-gru-l1-seed40-ep50-a100
  labels:
    app: gw-gru-time
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: gw-gru-time
    spec:
      restartPolicy: Never
      nodeSelector:
        gpu: a100
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - cl-worker24
      volumes:
      - name: gw-pred-rwx
        persistentVolumeClaim:
          claimName: gw-pred-rwx
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      containers:
      - name: gru-time
        image: row56/gw-pred:py312-cu124
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: 1
          limits:
            memory: 64Gi
            nvidia.com/gpu: 1
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: RUN_SIG
          value: "gru_l1_seed40_ep50_full_merged_spf0p8_sc20_ss42"
        - name: GRU_LAYERS
          value: "1"
        - name: GRU_HIDDEN
          value: "128"
        - name: GRU_DROPOUT
          value: "0.2"
        - name: EPOCHS
          value: "50"
        - name: SEED
          value: "40"
        volumeMounts:
        - name: gw-pred-rwx
          mountPath: /storage
        - name: dshm
          mountPath: /dev/shm
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          source /storage/venv/bin/activate

          WORKDIR="/tmp/gwl-gru-${RUN_SIG}"
          rsync -a /storage/gwl-interpolation/ "${WORKDIR}/"
          cd "${WORKDIR}"

          # Fix relative paths in configs/data.yaml after copying repo to /tmp
          python - <<'PY'
          from pathlib import Path
          import yaml

          repo_src = Path("/storage/gwl-interpolation").resolve()
          p = Path("configs/data.yaml")
          cfg = yaml.safe_load(p.read_text()) or {}
          for k in ["sample_path", "full_raw_path", "full_merged_path", "metadata_path"]:
              v = cfg.get(k)
              if not v:
                  continue
              pv = Path(str(v))
              if not pv.is_absolute():
                  cfg[k] = str((repo_src / pv).resolve())
          p.write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY

          # Write run-specific tft.yaml settings
          python - <<'PY'
          from pathlib import Path
          import os, yaml

          p = Path("configs/tft.yaml")
          cfg = yaml.safe_load(p.read_text()) or {}
          cfg["run_sig"] = os.environ["RUN_SIG"]
          cfg["dataset"] = "full_merged"

          cfg.setdefault("data", {})
          cfg["data"]["in_len"] = 52
          cfg["data"]["out_len"] = 16
          cfg["data"]["statics"] = True

          cfg.setdefault("model", {})
          cfg["model"]["gru_hidden"] = int(os.environ["GRU_HIDDEN"])
          cfg["model"]["gru_layers"] = int(os.environ["GRU_LAYERS"])
          cfg["model"]["gru_dropout"] = float(os.environ["GRU_DROPOUT"])
          cfg["model"]["dropout"] = float(os.environ["GRU_DROPOUT"])

          cfg.setdefault("training", {})
          cfg["training"]["epochs"] = int(os.environ["EPOCHS"])
          cfg["training"]["batch_size"] = 4096
          cfg["training"]["seed"] = int(os.environ["SEED"])
          cfg["training"]["num_workers"] = 10
          cfg["training"]["lr"] = 3e-4
          cfg["training"]["grad_clip"] = 1.0
          cfg["training"]["early_stopping"] = {
            "monitor": "val_loss",
            "patience": 5,
            "min_delta": 1e-4,
            "mode": "min",
          }

          cfg.setdefault("spatial_split", {})
          cfg["spatial_split"]["train_fraction"] = 0.8
          cfg["spatial_split"]["cluster_count"] = 20
          cfg["spatial_split"]["split_seed"] = 42
          cfg["spatial_split"]["exclude_terms"] = "geometry,x_25833,y_25833"

          p.write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY

          mkdir -p /storage/gwl-interpolation/reports/gru/logs
          {
            echo "=== TRAIN ${RUN_SIG} ==="
            time python src/scripts/joint/temporal/gru_train.py
            echo "=== EVAL ${RUN_SIG} ==="
            time python src/scripts/joint/temporal/gru_eval.py
          } 2>&1 | tee "/storage/gwl-interpolation/reports/gru/logs/${RUN_SIG}.log"

          mkdir -p /storage/gwl-interpolation/outputs/GRU_FCOV
          rsync -a \
            "outputs/GRU_FCOV/GRU_FCOV_${RUN_SIG}/" \
            "/storage/gwl-interpolation/outputs/GRU_FCOV/GRU_FCOV_${RUN_SIG}/"
