apiVersion: batch/v1
kind: Job
metadata:
  name: gw-gru-gp-lsp01
  labels:
    app: gw-gru-gp-joint
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: gw-gru-gp-joint
    spec:
      restartPolicy: Never
      nodeSelector:
        gpu: a100
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - cl-worker24
      volumes:
      - name: gw-pred-rwx
        persistentVolumeClaim:
          claimName: gw-pred-rwx
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      containers:
      - name: gru-gp-gpytorch
        image: row56/gw-pred:py312-cu124
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: 1
          limits:
            memory: 64Gi
            nvidia.com/gpu: 1
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: gw-pred-rwx
          mountPath: /storage
        - name: dshm
          mountPath: /dev/shm
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          source /storage/venv/bin/activate
          cd /storage/gwl-interpolation

          CFG=/tmp/gru_gp_lsp01.yaml
          sed 's/lambda_spatial: .*/lambda_spatial: 0.1/' configs/joint/gru_gp.yaml \
            | sed 's/^run_sig: .*/run_sig: in52_out16_ep50_seed40_full_merged_random_max_dist_90_lsp0p1_v2/' > $CFG

          mkdir -p reports/gru_gp/logs
          {
            echo "=== JOINT TRAIN lsp=0.1 ==="
            time python src/scripts/joint/gru_gp_train.py --config $CFG
            echo "=== JOINT EVAL ==="
            time python src/scripts/joint/gru_gp_eval.py --config $CFG
          } 2>&1 | tee "reports/gru_gp/logs/joint_lsp0p1.log"
